<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ログイン - すたくろ管理アプリ</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><section class="card" style="max-width:460px;margin:8vh auto"><h1>すたくろ管理アプリ</h1><h2>メンバーログイン</h2><p class="muted">自分の名前を選び、管理者から共有された暗証番号を入力してください。</p><form id="loginForm"><label>メンバー<select id="member" required><option value="">選択してください</option><option>四宮</option><option>るーゔ</option><option>ちなつ</option><option>しーた</option><option>Moon</option></select></label><label>暗証番号<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><button type="submit" class="primary-btn">ログイン</button></form><p id="loginMessage" class="message" role="status"></p></section></main><script src="config.js"></script><script src="app.js"></script><script src="login.js"></script></body></html>
