<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スケジュール - すたくろ管理アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>スケジュール</h1>
    <p id="userInfo">読み込み中...</p>
  </div>
  <button id="logoutBtn" class="small-btn hidden">ログアウト</button>
</header>

<main class="page">
  <section class="card">
    <h2>空き時間を登録</h2>
    <p class="muted">自分が参加できる時間を登録してください。</p>

    <form id="scheduleForm">
      <label>日付
        <input type="date" id="date" required>
      </label>
      <div class="two-col">
        <label>開始
          <input type="time" id="start" required>
        </label>
        <label>終了
          <input type="time" id="end" required>
        </label>
      </div>
      <button type="submit" class="primary-btn">登録する</button>
    </form>
    <p id="formMessage" class="message"></p>
  </section>

  <section class="card">
    <div class="section-title">
      <h2>みんなの登録状況</h2>
      <button id="reloadBtn" class="small-btn">更新</button>
    </div>
    <div id="scheduleList">読み込み中...</div>
  </section>

  <section class="card">
    <h2>共通の空き時間を探す</h2>
    <div class="two-col">
      <label>開始日
        <input type="date" id="searchFrom">
      </label>
      <label>終了日
        <input type="date" id="searchTo">
      </label>
    </div>
    <label>参加可能人数
      <select id="requiredCount">
        <option value="5">全員</option>
        <option value="4">4人以上</option>
        <option value="3">3人以上</option>
        <option value="2">2人以上</option>
        <option value="1">1人以上</option>
      </select>
    </label>
    <button id="searchBtn" class="primary-btn">検索する</button>
    <div id="commonResults"></div>
  </section>
</main>

<nav class="bottom-nav">
  <a href="index.html">ホーム</a>
  <a class="active" href="schedule.html">予定</a>
  <a href="meetings.html">会議</a>
  <a href="tasks.html">タスク</a>
  <a href="rules.html">規約</a>
</nav>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="schedule.js"></script>
</body>
</html>
